services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123 # Em produção, usaremos o .env
      POSTGRES_DB: web_collection_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: scraper_app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://user_admin:password123@db:5432/web_collection_db
    depends_on:
      - db

volumes:
  postgres_data: