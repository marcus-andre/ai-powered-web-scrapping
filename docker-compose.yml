services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-web_collection_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: mongodb_raw
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: scraper_app
    restart: always
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user_admin}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-web_collection_db}
      MONGO_URL: mongodb://mongodb:27017/raw_data_db
      API_KEY: ${API_KEY} # Security token for API access
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mongodb

  dashboard:
    build: .
    container_name: streamlit_dashboard
    restart: always
    volumes:
      - .:/app
    environment:
      API_URL: ${API_URL:-http://app:8000}
      API_KEY: ${API_KEY:-my_dev_secret_key_123}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "8501:8501" # Default Streamlit port
    command: ["streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - app

volumes:
  postgres_data:
  mongo_data: